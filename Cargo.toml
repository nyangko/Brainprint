[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/daemon",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/nyangko/Brainprint"

[workspace.dependencies]
brainprint-core = { path = "crates/core" }
brainprint-engine = { path = "crates/engine" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
notify = "8"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", default-features = false }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
perf = "warn"
