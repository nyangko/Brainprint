[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/daemon",
    "crates/cli",
    "crates/mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# #25 Task 12 amendment: raised from 1.85 -> 1.88, the minimum the
# official `rmcp` MCP SDK's 3.x line requires (rmcp 1.x cannot compile
# on stable Rust at all -- verified). Not an unrelated modernization.
rust-version = "1.88"
repository = "https://github.com/nyangko/Brainprint"

[workspace.dependencies]
brainprint-core = { path = "crates/core" }
brainprint-engine = { path = "crates/engine" }
# #25 Task 12: official Model Context Protocol Rust SDK, pinned exactly
# per the amended design decision. No git dependency.
rmcp = { version = "=3.4.0", default-features = false }
# Task 11 CLI grammar: seven operation families, dozens of typed flags
# with closed vocabularies and mutual-exclusion groups. The existing
# hand-rolled match parser (three flat commands) does not scale to this;
# clap's derive API is the standard tool for exactly this shape.
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
notify = "8"
# Linear-time, backtracking-free matcher for the bounded text fallback
# (#16 task 12). Already in the tree via tree-sitter; depended on
# directly so the fallback never needs an external `rg` binary.
regex = "1"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", default-features = false }
toml = "1.1"
# Tier-1 structural parser backend and its grammars (#16 task 7). Versions
# are Cargo dependencies, deliberately not architecture constants.
tree-sitter = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-svelte-ng = "1.0"
tree-sitter-typescript = "0.23"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
perf = "warn"
