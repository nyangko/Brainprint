<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Brainprint</title>
  <desc id="desc">Repository knowledge is continuously structured into fresh, compact context for AI agents.</desc>
  <defs>
