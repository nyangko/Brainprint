<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
<title id="title">Brainprint</title>
<desc id="desc">Brainprint — local-first shared context runtime for AI coding agents.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050b16"/>
    <stop offset=".48" stop-color="#081326"/>
    <stop offset="1" stop-color="#0b0c1b"/>
  </linearGradient>

  <radialGradient id="ambientCyan" cx="50%" cy="47%" r="52%">
    <stop offset="0" stop-color="#06b6d4" stop-opacity=".22"/>
    <stop offset=".38" stop-color="#0ea5e9" stop-opacity=".10"/>
    <stop offset=".72" stop-color="#2563eb" stop-opacity=".035"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="ambientLeft" cx="22%" cy="58%" r="28%">
    <stop offset="0" stop-color="#0284c7" stop-opacity=".16"/>
    <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="ambientRight" cx="79%" cy="58%" r="28%">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".15"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f8fafc"/>
    <stop offset=".48" stop-color="#e2e8f0"/>
    <stop offset=".70" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>

  <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>

  <linearGradient id="cyanStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#67e8f9"/>
    <stop offset="1" stop-color="#0ea5e9"/>
  </linearGradient>

  <linearGradient id="violetStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c4b5fd"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>

  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".045" stroke-width="1"/>
  </pattern>

  <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="17" result="b1"/>
    <feFlood flood-color="#0ea5e9" flood-opacity=".48" result="c1"/>
    <feComposite in="c1" in2="b1" operator="in" result="g1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b2"/>
    <feFlood flood-color="#38bdf8" flood-opacity=".78" result="c2"/>
    <feComposite in="c2" in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="glowCyan" x="-55%" y="-55%" width="210%" height="210%">
    <feGaussianBlur stdDeviation="22" result="b1"/>
    <feFlood flood-color="#06b6d4" flood-opacity=".55" result="c1"/>
    <feComposite in="c1" in2="b1" operator="in" result="g1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="6.5" result="b2"/>
    <feFlood flood-color="#67e8f9" flood-opacity=".88" result="c2"/>
    <feComposite in="c2" in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="glowViolet" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18" result="b1"/>
    <feFlood flood-color="#7c3aed" flood-opacity=".50" result="c1"/>
    <feComposite in="c1" in2="b1" operator="in" result="g1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b2"/>
    <feFlood flood-color="#a78bfa" flood-opacity=".82" result="c2"/>
    <feComposite in="c2" in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feFlood flood-color="#38bdf8" flood-opacity=".34" result="flood"/>
    <feComposite in="flood" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="softGlowCyan" x="-80%" y="-100%" width="260%" height="300%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feFlood flood-color="#22d3ee" flood-opacity=".75" result="flood"/>
    <feComposite in="flood" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="softGlowViolet" x="-80%" y="-100%" width="260%" height="300%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feFlood flood-color="#8b5cf6" flood-opacity=".74" result="flood"/>
    <feComposite in="flood" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1800" height="600" rx="28" fill="url(#bg)"/>
<rect width="1800" height="600" rx="28" fill="url(#grid)"/>
<rect width="1800" height="600" rx="28" fill="url(#ambientCyan)"/>
<rect width="1800" height="600" rx="28" fill="url(#ambientLeft)"/>
<rect width="1800" height="600" rx="28" fill="url(#ambientRight)"/>

<ellipse cx="300" cy="490" rx="300" ry="55" fill="#0ea5e9" opacity=".055"/>
<ellipse cx="910" cy="490" rx="330" ry="65" fill="#22d3ee" opacity=".075"/>
<ellipse cx="1510" cy="490" rx="290" ry="55" fill="#8b5cf6" opacity=".065"/>

<text x="900" y="102" text-anchor="middle"
      font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="82" font-weight="800" letter-spacing="-3"
      fill="url(#titleGrad)" filter="url(#titleGlow)">Brainprint</text>

<text x="900" y="145" text-anchor="middle"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="22" letter-spacing=".7" fill="#93c5fd">
  Local-first shared context runtime for AI coding agents
</text>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#60a5fa" opacity=".62">
  <text x="46" y="64">YOUR CODE</text>
  <text x="46" y="84">MORE CONTEXT</text>
  <text x="46" y="104">BETTER AGENTS</text>

  <text x="1718" y="64" text-anchor="end">LOCAL</text>
  <text x="1718" y="84" text-anchor="end">PRIVATE</text>
  <text x="1718" y="104" text-anchor="end">SHARED</text>
</g>

<g transform="translate(72 210)" filter="url(#glowBlue)">
  <rect width="450" height="274" rx="20" fill="#091426" fill-opacity=".96" stroke="url(#blueStroke)" stroke-width="2.2"/>
  <line x1="0" y1="66" x2="450" y2="66" stroke="#1e3a5f"/>
  <g transform="translate(24 20)">
    <path d="M2 12h17l6 6h25v31H2z" fill="#0ea5e9"/>
    <path d="M2 12h17l5 5H2z" fill="#67e8f9"/>
  </g>
  <text x="82" y="43" font-family="Inter,ui-sans-serif,system-ui" font-size="25" font-weight="700" fill="#f8fafc">Repository</text>
  <text x="420" y="43" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.4" fill="#60a5fa">YOUR PROJECT</text>

  <g font-family="ui-monospace,monospace" font-size="16" fill="#bfdbfe">
    <text x="34" y="104">▰  src/</text>
    <text x="34" y="136">▰  docs/</text>
    <text x="34" y="168">▰  configs/</text>
    <text x="34" y="200">▰  tests/</text>
    <text x="34" y="232">▤  README.md</text>
  </g>

  <rect x="230" y="92" width="190" height="146" rx="12" fill="#07111f" stroke="#1d4e78"/>
  <g stroke-linecap="round" stroke-width="7">
    <line x1="250" y1="114" x2="286" y2="114" stroke="#67e8f9"/>
    <line x1="296" y1="114" x2="344" y2="114" stroke="#334155"/>
    <line x1="250" y1="136" x2="332" y2="136" stroke="#2563eb"/>
    <line x1="344" y1="136" x2="390" y2="136" stroke="#334155"/>
    <line x1="250" y1="158" x2="300" y2="158" stroke="#38bdf8"/>
    <line x1="310" y1="158" x2="382" y2="158" stroke="#475569"/>
    <line x1="250" y1="180" x2="276" y2="180" stroke="#818cf8"/>
    <line x1="286" y1="180" x2="356" y2="180" stroke="#334155"/>
    <line x1="250" y1="202" x2="320" y2="202" stroke="#334155"/>
  </g>
</g>

<g transform="translate(550 312)" filter="url(#softGlowCyan)">
  <path d="M0 22h118" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M108 6l26 16-26 16z" fill="#67e8f9"/>
</g>
<g transform="translate(550 312)" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2" fill="#67e8f9">
  <text x="64" y="72" text-anchor="middle">ANALYZE</text>
  <text x="64" y="92" text-anchor="middle">UNDERSTAND</text>
  <text x="64" y="112" text-anchor="middle">EXTRACT</text>
</g>

<g transform="translate(696 210)" filter="url(#glowCyan)">
  <rect width="430" height="274" rx="20" fill="#081827" fill-opacity=".97" stroke="url(#cyanStroke)" stroke-width="2.6"/>
  <line x1="0" y1="66" x2="430" y2="66" stroke="#155e75"/>

  <g transform="translate(24 19)" fill="none" stroke="#67e8f9" stroke-width="3">
    <path d="M18 2l16 9v18l-16 9-16-9V11z"/>
    <path d="M2 11l16 9 16-9M18 20v18"/>
  </g>

  <text x="76" y="43" font-family="Inter,ui-sans-serif,system-ui" font-size="25" font-weight="700" fill="#f8fafc">Fresh Context</text>
  <text x="401" y="43" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.3" fill="#67e8f9">COMPACT &amp; RELEVANT</text>

  <g font-family="ui-monospace,monospace" font-size="15">
    <rect x="24" y="86" width="382" height="38" rx="10" fill="#071521" stroke="#155e75"/>
    <text x="62" y="111" fill="#e0f2fe">Key files</text>
    <text x="340" y="111" text-anchor="end" fill="#334155">━━━━━━</text>

    <rect x="24" y="132" width="382" height="38" rx="10" fill="#071521" stroke="#155e75"/>
    <text x="62" y="157" fill="#e0f2fe">Core concepts</text>
    <text x="340" y="157" text-anchor="end" fill="#334155">━━━━━━</text>

    <rect x="24" y="178" width="382" height="38" rx="10" fill="#071521" stroke="#155e75"/>
    <text x="62" y="203" fill="#e0f2fe">APIs &amp; patterns</text>
    <text x="340" y="203" text-anchor="end" fill="#334155">━━━━━━</text>

    <rect x="24" y="224" width="382" height="38" rx="10" fill="#071521" stroke="#155e75"/>
    <text x="62" y="249" fill="#e0f2fe">Current task</text>
    <text x="340" y="249" text-anchor="end" fill="#334155">━━━━━━</text>
  </g>

  <g stroke="#67e8f9" stroke-width="2.5" fill="none">
    <rect x="36" y="96" width="13" height="18" rx="2"/>
    <path d="M36 142h13M36 150h13M36 158h13"/>
    <path d="M38 188l-6 8 6 8M48 188l6 8-6 8"/>
    <path d="M36 235h13l7 8-7 8H36l-7-8z"/>
  </g>
</g>

<g transform="translate(1154 312)" filter="url(#softGlowViolet)">
  <path d="M0 22h118" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <path d="M108 6l26 16-26 16z" fill="#a78bfa"/>
</g>
<g transform="translate(1154 312)" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2" fill="#a78bfa">
  <text x="64" y="72" text-anchor="middle">SHARE</text>
  <text x="64" y="92" text-anchor="middle">SYNC</text>
  <text x="64" y="112" text-anchor="middle">EMPOWER</text>
</g>

<g transform="translate(1296 210)" filter="url(#glowViolet)">
  <rect width="432" height="274" rx="20" fill="#0c1228" fill-opacity=".97" stroke="url(#violetStroke)" stroke-width="2.5"/>
  <line x1="0" y1="66" x2="432" y2="66" stroke="#4c1d95"/>

  <g transform="translate(23 20)" stroke="#a78bfa" stroke-width="3" fill="none">
    <rect x="4" y="9" width="36" height="24" rx="9"/>
    <circle cx="14" cy="21" r="2.8" fill="#c4b5fd" stroke="none"/>
    <circle cx="30" cy="21" r="2.8" fill="#c4b5fd" stroke="none"/>
    <path d="M22 9V3M18 3h8M0 19h4M40 19h4"/>
  </g>

  <text x="77" y="43" font-family="Inter,ui-sans-serif,system-ui" font-size="25" font-weight="700" fill="#f8fafc">AI Agent</text>
  <text x="402" y="43" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.2" fill="#c4b5fd">HIGHER QUALITY WORK</text>

  <rect x="26" y="88" width="380" height="66" rx="12" fill="#17172f" stroke="#4c1d95"/>
  <text x="48" y="114" font-family="ui-monospace,monospace" font-size="14" fill="#ddd6fe">Use the project context to</text>
  <text x="48" y="136" font-family="ui-monospace,monospace" font-size="14" fill="#ddd6fe">implement this feature...</text>

  <rect x="26" y="168" width="380" height="92" rx="12" fill="#0a1020" stroke="#4c1d95"/>
  <g stroke-linecap="round" stroke-width="7">
    <line x1="52" y1="194" x2="102" y2="194" stroke="#a78bfa"/>
    <line x1="114" y1="194" x2="156" y2="194" stroke="#6366f1"/>
    <line x1="52" y1="216" x2="124" y2="216" stroke="#38bdf8"/>
    <line x1="136" y1="216" x2="232" y2="216" stroke="#334155"/>
    <line x1="52" y1="238" x2="172" y2="238" stroke="#8b5cf6"/>
    <line x1="184" y1="238" x2="348" y2="238" stroke="#334155"/>
  </g>
</g>

<line x1="430" y1="540" x2="640" y2="540" stroke="#2563eb" stroke-opacity=".72"/>
<line x1="1160" y1="540" x2="1370" y2="540" stroke="#7c3aed" stroke-opacity=".68"/>
<text x="900" y="546" text-anchor="middle"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="16" letter-spacing="5" fill="#7dd3fc">
  SAME CODEBASE. A SHARPER MIND.
</text>
</svg>