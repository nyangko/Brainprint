name: Acceptance

# Correctness CI (#15 task 12, extended by #16 task 15 and #17 task 15),
# not a product feature: builds and runs the full workspace -- including
# the real-binary end-to-end acceptance suite in
# crates/daemon/tests/i1_acceptance.rs, the I2 acceptance suite, and the
# I3 Relation Graph acceptance suite -- on all three P0 Tier-1 platforms.
# Windows runs the exact same suites as Linux/macOS (no stubbing/skipping
# of Windows-specific behavior), so this is what actually exercises the
# Windows Named Pipe transport and CLI/daemon handshake/status on a real
# Windows runner.
#
# Benchmark measurement is deliberately not here: it lives in the I0
# smoke workflow's baseline step and in the `i2_benchmark`/`i3_benchmark`
# examples, so a timing wobble can never fail correctness CI.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      # Must run after Build: the I1 acceptance suite
      # (crates/daemon/tests/i1_acceptance.rs) spawns the actual
      # `brainprint` binary alongside `brainprintd`, and `cargo test`
      # alone does not guarantee another package's `[[bin]]` target (as
      # opposed to its own test harness) has been built yet.
      - name: Test (unit + integration + I1 real-binary acceptance suite)
        run: cargo test --workspace --locked

      # Already covered by the workspace run above; named separately so
      # a milestone acceptance failure is legible in the CI summary
      # instead of being one line inside 600 tests.
      - name: I2 acceptance
        run: cargo test -p brainprint-engine --locked --test i2_acceptance

      - name: I3 acceptance (Relation Graph)
        run: cargo test -p brainprint-engine --locked --test i3_acceptance

      - name: CLI and daemon smoke
        run: |
          ./target/debug/brainprint --version
          ./target/debug/brainprint --help
          ./target/debug/brainprintd --version
          ./target/debug/brainprintd --help

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-cargo-lock-${{ matrix.os }}
          path: Cargo.lock
          retention-days: 7
