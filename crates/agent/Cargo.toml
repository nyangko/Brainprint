[package]
name = "brainprint-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "brainprint_agent"
path = "src/lib.rs"

[[bin]]
name = "brainprint-agent"
path = "src/main.rs"

# #26 "Architecture": brainprint-core plus serde/serde_json/clap/tokio
# only. Never brainprint-engine/-daemon/-mcp.
[dependencies]
brainprint-core.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }

[lints]
workspace = true
